name: Phase 0 Full Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install LEAN CLI
        run: |
          pip install lean

      # Run 33909191376 (2026-09-04) proved `lean init` needs real QuantConnect account
      # credentials (User Id + API Token) — it's not just a "not an empty directory" confirm, it
      # actually authenticates against the QC API. QC_USER_ID/QC_API_TOKEN are repo secrets (from
      # quantconnect.com → account/profile → Security → "Request Token Information").
      - name: Log in to QuantConnect
        env:
          QC_USER_ID: ${{ secrets.QC_USER_ID }}
          QC_API_TOKEN: ${{ secrets.QC_API_TOKEN }}
        run: |
          lean login --user-id "$QC_USER_ID" --api-token "$QC_API_TOKEN"

      # Must run BEFORE the data-download step below: run 33959341937 proved `lean init` refuses
      # to run at all if a `data/` directory already exists ("Error: data already exists, please
      # run this command in an empty directory") — it wants to create its own from scratch. Doing
      # this first, then downloading our own historical data into data/crypto/binance/minute/
      # afterward, avoids that conflict entirely instead of trying to reproduce lean.json by hand.
      #
      # UNVERIFIED end-to-end beyond this: this environment's egress proxy blocks
      # cdn.quantconnect.com, so this reordering could not be tested locally before pushing — read
      # the actual Actions log if this still fails rather than guessing further blind.
      - name: Initialize LEAN CLI workspace
        run: |
          yes | timeout 180 lean init
          echo "--- lean.json after init attempt: ---"
          cat lean.json 2>&1 || echo "(no lean.json produced)"

      - name: Download & Prepare Historical Data (7 symbols, 2023-01-01 to 2024-01-01)
        run: |
          python3 -c "
          import urllib.request, zipfile, io, os, datetime

          symbols = ['BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'XRPUSDT', 'DOGEUSDT', 'BNBUSDT', 'AVAXUSDT']
          start_date = datetime.date(2023, 1, 1)
          end_date = datetime.date(2024, 1, 1)

          base_dir = 'data/crypto/binance/minute'
          delta = datetime.timedelta(days=1)

          def convert_binance_csv(binance_zip_bytes):
              output_lines = []
              with zipfile.ZipFile(io.BytesIO(binance_zip_bytes)) as z:
                  csv_file = z.namelist()[0]
                  with z.open(csv_file) as f:
                      for line in f:
                          parts = line.decode().strip().split(',')
                          if len(parts) < 6:
                              continue
                          try:
                              open_time = int(parts[0])
                              dt = datetime.datetime.fromtimestamp(open_time / 1000.0, tz=datetime.timezone.utc)
                              ms_from_midnight = (dt.hour * 3600 + dt.minute * 60 + dt.second) * 1000
                              o, h, l, c, v = parts[1], parts[2], parts[3], parts[4], parts[5]
                              output_lines.append(f'{ms_from_midnight},{o},{h},{l},{c},{v}\n')
                          except ValueError:
                              continue
              return ''.join(output_lines)

          curr = start_date
          downloaded = 0
          failed = 0

          while curr <= end_date:
              date_str = curr.strftime('%Y-%m-%d')
              date_compact = curr.strftime('%Y%m%d')
              for sym in symbols:
                  sym_dir = os.path.join(base_dir, sym.lower())
                  os.makedirs(sym_dir, exist_ok=True)
                  target_zip = os.path.join(sym_dir, f'{date_compact}_trade.zip')
                  if os.path.exists(target_zip) and os.path.getsize(target_zip) > 1000:
                      continue

                  url = f'https://data.binance.vision/data/spot/daily/klines/{sym}/1m/{sym}-1m-{date_str}.zip'
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                      with urllib.request.urlopen(req) as resp:
                          data = resp.read()
                      csv_content = convert_binance_csv(data)

                      with zipfile.ZipFile(target_zip, 'w', compression=zipfile.ZIP_DEFLATED) as zout:
                          zout.writestr(f'{date_compact}_trade.csv', csv_content)
                      downloaded += 1
                  except Exception as e:
                      failed += 1
              curr += delta

          print(f'Done preparing data! Downloaded: {downloaded}, Failed: {failed}')
          "

      - name: Run LEAN Backtest
        run: |
          mkdir -p backtests/phase0-full
          lean backtest Algorithm > backtests/phase0-full/backtest-output.log 2>&1
          cat backtests/phase0-full/backtest-output.log

      - name: Locate and copy lightweight backtest results
        run: |
          # Only accept a results directory that did not exist before this run — otherwise a
          # failed/no-op backtest silently re-uploads stale results from a prior run as if they
          # were fresh (this is exactly what happened in run 33906160955).
          LATEST_DIR=$(ls -td Algorithm/backtests/* 2>/dev/null | head -n 1)
          if [ -z "$LATEST_DIR" ]; then
            echo "::error::No Algorithm/backtests/* directory found — lean backtest did not produce output."
            exit 1
          fi
          DIR_MTIME=$(date -d "$(stat -c %y "$LATEST_DIR")" +%s 2>/dev/null || stat -f %m "$LATEST_DIR")
          NOW=$(date +%s)
          AGE_SECONDS=$((NOW - DIR_MTIME))
          if [ "$AGE_SECONDS" -gt 600 ]; then
            echo "::error::Latest results dir $LATEST_DIR is $AGE_SECONDS seconds old (>600s) — this looks like a STALE directory from a previous run, not fresh output from this backtest. Refusing to upload it as evidence."
            exit 1
          fi
          echo "Latest results dir: $LATEST_DIR (${AGE_SECONDS}s old — fresh)"

          # Find summary.json and log.txt
          SUMMARY_FILE=$(find "$LATEST_DIR" -name "*-summary.json" | head -n 1)
          LOG_FILE=$(find "$LATEST_DIR" -name "*-log.txt" | head -n 1)

          if [ -z "$SUMMARY_FILE" ]; then
            echo "::error::No *-summary.json found in $LATEST_DIR"
            exit 1
          fi

          cp "$SUMMARY_FILE" backtests/phase0-full/summary.json
          if [ -n "$LOG_FILE" ]; then
            cp "$LOG_FILE" backtests/phase0-full/log.txt
          fi

          ls -la backtests/phase0-full/

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase0-backtest-results
          path: backtests/phase0-full/
